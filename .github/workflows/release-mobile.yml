name: Release mobile

# Builds and optionally submits the iOS and Android binaries with EAS.
#
# Always manual. A store submission is a deliberate, irreversible act, and the
# review queue is not somewhere to discover that main was briefly broken.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: 'Platform to build'
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: 'Submit to the stores after a successful build (production only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-mobile-${{ inputs.profile }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.20.0'
  PNPM_VERSION: '10.33.0'

jobs:
  build:
    name: EAS build (${{ inputs.profile }} / ${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.profile == 'production' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # eas.json sets requireCommit: true, so the build must correspond to
          # a real commit and the checkout must carry its history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Require an EAS token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN is not configured. See docs/APP_STORE_RELEASE.md."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm run build:packages

      # Everything that can fail cheaply fails before a 30-minute cloud build.
      - name: Typecheck and lint
        run: |
          pnpm --filter @lingolive/mobile typecheck
          pnpm --filter @lingolive/mobile lint

      - name: No provider key can reach the app
        run: pnpm check:secrets

      - name: Build
        env:
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_OWNER: ${{ vars.EXPO_OWNER }}
          IOS_BUNDLE_IDENTIFIER: ${{ vars.IOS_BUNDLE_IDENTIFIER }}
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          EXPO_PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
        run: |
          pnpm --filter @lingolive/mobile exec eas build \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}" \
            --non-interactive \
            --no-wait

      - name: Where to find the build
        run: |
          echo "### EAS build started" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- profile: \`${{ inputs.profile }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- platform: \`${{ inputs.platform }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Follow it at https://expo.dev/accounts/${{ vars.EXPO_OWNER }}/projects/lingolive/builds" >> "$GITHUB_STEP_SUMMARY"

  submit:
    name: Submit to the stores
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ inputs.submit && inputs.profile == 'production' }}
    timeout-minutes: 60
    # A protected environment means a human approves before anything is
    # uploaded to App Store Connect or Google Play.
    environment: production-submit

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured."
            exit 1
          fi
          # Written outside the repository and removed by the runner teardown.
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-key.json"
          echo "ANDROID_SERVICE_ACCOUNT_KEY_PATH=$RUNNER_TEMP/play-key.json" >> "$GITHUB_ENV"

      - name: Submit to App Store Connect
        if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: pnpm --filter @lingolive/mobile exec eas submit --platform ios --profile production --non-interactive --latest

      - name: Submit to Google Play
        if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
        run: pnpm --filter @lingolive/mobile exec eas submit --platform android --profile production --non-interactive --latest

      - name: Remove the service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"
