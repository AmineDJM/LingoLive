# =============================================================================
# LingoLive — Render Blueprint (production)
# -----------------------------------------------------------------------------
# Apply this as a SECOND Blueprint instance, path
# `infra/render.production.yaml`, once there is a verified domain. Until then
# it cannot boot: APP_BASE_URL, WEB_BASE_URL, API_BASE_URL and
# CORS_ALLOWED_ORIGINS must be real https URLs, and the configuration schema
# refuses anything else outside development.
#
#   lingolive-api-production     Fastify + WebSocket, 2 instances
#   lingolive-web-production     Next.js, 2 instances
#   lingolive-worker-production  retention & maintenance jobs
#   lingolive-db-production      PostgreSQL 16
#   lingolive-redis-production   Redis
#
# Nothing here deploys on push. A production release is a deliberate act:
# Render dashboard → the service → Manual Deploy. Order: API (its pre-deploy
# command runs the migrations), then worker, then web.
#
# Before applying, fill in the dashboard:
#   APP_BASE_URL, WEB_BASE_URL, API_BASE_URL, CORS_ALLOWED_ORIGINS
#   OPENAI_API_KEY, ADMIN_EMAILS
#   and on the web service: NEXT_PUBLIC_API_URL, NEXT_PUBLIC_WEB_URL,
#   NEXT_PUBLIC_SITE_URL
#
# These plans cost real money every month whether or not anyone uses the
# product. Do not apply this file to "see if it works" — infra/render.yaml is
# for that.
# =============================================================================

previewsEnabled: false

databases:
  - name: lingolive-db-production
    databaseName: lingolive
    user: lingolive
    plan: pro-4gb
    postgresMajorVersion: '16'
    ipAllowList: []

services:
  - type: keyvalue
    name: lingolive-redis-production
    plan: standard
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # ---------------------------------------------------------------------------
  # API — production
  # ---------------------------------------------------------------------------
  - type: web
    name: lingolive-api-production
    runtime: node
    plan: standard
    region: frankfurt
    rootDir: .
    # Production never deploys on push. A release is a deliberate act.
    autoDeploy: false
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm exec prisma generate --schema prisma/schema.prisma
      pnpm --filter @lingolive/api build
    # Waits for PostgreSQL before migrating: on a first apply the database
    # is often still provisioning, and `migrate deploy` does not retry.
    preDeployCommand: node infra/scripts/migrate.mjs
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    numInstances: 2 # Realtime fan-out is Redis-backed, so instances are interchangeable.
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          { name: lingolive-db-production, property: connectionString }
      - key: REDIS_URL
        fromService:
          {
            name: lingolive-redis-production,
            type: keyvalue,
            property: connectionString,
          }
      - key: APP_BASE_URL
        sync: false # https://lingolive.app once the domain is verified.
      - key: WEB_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DEEP_LINK_SCHEME
        value: lingolive
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: TRANSCRIPT_ENCRYPTION_KEY
        generateValue: true
      - key: TRANSCRIPT_ENCRYPTION_KEY_VERSION
        value: '1'
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-live-transcribe
      - key: OPENAI_TRANSLATION_MODEL
        # As above. Re-verify with `pnpm check:provider --all` before a release.
        value: gpt-5.6-luna
      - key: REALTIME_TOKEN_TTL_SECONDS
        value: '60'
      - key: OPENAI_REALTIME_SESSION_PATH
        value: /client_secrets
      - key: GUEST_MINUTES_PER_MONTH
        value: '30'
      - key: FREE_MINUTES_PER_MONTH
        value: '120'
      - key: PRO_MINUTES_PER_MONTH
        value: '6000'
      # Deliberately low starting values. The circuit breaker refusing new
      # sessions is recoverable in one dashboard edit; an unbounded provider
      # bill is not. Raise them from the operator console once real usage is
      # visible — no deploy needed.
      - key: DAILY_COST_LIMIT_USD
        value: '25'
      - key: MONTHLY_COST_LIMIT_USD
        value: '200'
      - key: COST_CIRCUIT_BREAKER_ENABLED
        value: 'true'
      - key: SENTRY_DSN
        value: '' # Optional; empty means the integration is off.
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: POSTHOG_KEY
        value: '' # Optional; empty means the integration is off.
      - key: ANALYTICS_ENABLED
        value: 'false'
      # Forced off in production by the config schema as well — belt and braces.
      - key: ENABLE_DEV_SIMULATOR
        value: 'false'
      - key: ENABLE_REQUEST_LOGGING
        value: 'false'

  # ---------------------------------------------------------------------------
  # Web — production
  # ---------------------------------------------------------------------------
  - type: web
    name: lingolive-web-production
    runtime: node
    plan: standard
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm --filter @lingolive/web build
    startCommand: pnpm --filter @lingolive/web start
    healthCheckPath: /en
    numInstances: 2
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WEB_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: '' # Optional; empty means the integration is off.
      - key: NEXT_PUBLIC_POSTHOG_KEY
        value: '' # Optional; empty means the integration is off.
      - key: NEXT_PUBLIC_ALLOW_INDEXING
        value: 'true'

  - type: worker
    name: lingolive-worker-production
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: false
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm exec prisma generate --schema prisma/schema.prisma
      pnpm --filter @lingolive/api build
      pnpm --filter @lingolive/worker build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          { name: lingolive-db-production, property: connectionString }
      - key: REDIS_URL
        fromService:
          {
            name: lingolive-redis-production,
            type: keyvalue,
            property: connectionString,
          }
      - key: TRANSCRIPT_ENCRYPTION_KEY
        fromService:
          {
            name: lingolive-api-production,
            type: web,
            envVarKey: TRANSCRIPT_ENCRYPTION_KEY,
          }
      - key: TRANSCRIPT_ENCRYPTION_KEY_VERSION
        value: '1'
      - key: SESSION_SIGNING_SECRET
        fromService:
          {
            name: lingolive-api-production,
            type: web,
            envVarKey: SESSION_SIGNING_SECRET,
          }
      - key: AUTH_SECRET
        fromService:
          { name: lingolive-api-production, type: web, envVarKey: AUTH_SECRET }
      # Retention, expiry and deletion only. It never calls an AI provider,
      # never serves a request and never emits a URL, so OPENAI_API_KEY,
      # ADMIN_API_TOKEN and the base URLs are all deliberately absent — the
      # smallest set of credentials that lets it do its job.
      - key: SERVICE_ROLE
        value: worker
      - key: RETENTION_UNSAVED_SESSION_HOURS
        value: '1'
      - key: RETENTION_BUSINESS_SESSION_DAYS
        value: '7'
      - key: RETENTION_TECHNICAL_LOG_DAYS
        value: '30'
      - key: WORKER_INTERVAL_MS
        value: '300000'
