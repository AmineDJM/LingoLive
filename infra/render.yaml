# =============================================================================
# LingoLive — Render Blueprint (staging)
# -----------------------------------------------------------------------------
# One working environment:
#
#   lingolive-api-staging     Fastify + WebSocket           (web service)
#   lingolive-web-staging     Next.js                       (web service)
#   lingolive-worker-staging  retention & maintenance jobs  (worker)
#   lingolive-db-staging      PostgreSQL 16
#   lingolive-redis-staging   Redis (fan-out, rate limits, replay guard)
#
# Production is NOT here. It lives in infra/render.production.yaml and is
# applied as a second Blueprint when there is a domain to point it at.
#
# The reason is money and failure. Production needs a real domain: without one,
# APP_BASE_URL and friends cannot be filled and the API refuses to boot — so a
# combined Blueprint provisions a production-sized database and two standard
# instances that immediately fail, and bills for them. Splitting means applying
# this file gives one environment that works, on the cheapest plans, for the
# price of a coffee.
#
# Apply with the Render dashboard (Blueprints → New Blueprint Instance), path
# `infra/render.yaml`. See docs/DEPLOYMENT.md.
#
# No service pins a `branch`: each follows the branch the Blueprint is synced
# from, chosen in the dashboard, so this file validates on any repository.
#
# Secrets are NEVER in this file. Two values must be entered in the dashboard
# before the first deploy: OPENAI_API_KEY and ADMIN_EMAILS.
# =============================================================================

previewsEnabled: true
previewsExpireAfterDays: 7

databases:
  - name: lingolive-db-staging
    databaseName: lingolive
    user: lingolive
    plan: basic-256mb
    postgresMajorVersion: '16'
    # MUST match every service's region. Render's internal hostname
    # (dpg-...-a) only resolves inside one region, so a Frankfurt service
    # cannot reach an Oregon database — it fails with P1001, "can't reach
    # database server", which reads exactly like a database that is still
    # starting and is not. Omitting this defaults to Oregon.
    region: frankfurt
    ipAllowList: [] # Render-internal only.

services:
  # ---------------------------------------------------------------------------
  # Redis / Key-value
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: lingolive-redis-staging
    plan: starter
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction # Replay-guard keys must not be evicted early.

  # ---------------------------------------------------------------------------
  # API — staging
  # ---------------------------------------------------------------------------
  - type: web
    name: lingolive-api-staging
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: true
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm exec prisma generate --schema prisma/schema.prisma
      pnpm --filter @lingolive/api build
    # Migrations run before the new instance takes traffic, and never in
    # parallel with the old one serving it. The wrapper waits for PostgreSQL:
    # on a first apply the database is often still provisioning, and
    # `prisma migrate deploy` does not retry.
    preDeployCommand: node infra/scripts/migrate.mjs
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase: { name: lingolive-db-staging, property: connectionString }
      - key: REDIS_URL
        fromService:
          {
            name: lingolive-redis-staging,
            type: keyvalue,
            property: connectionString,
          }
      # These are the app's PUBLIC addresses: they end up in join links, QR
      # codes and canonical tags, and they decide which origin the browser is
      # allowed to call from.
      #
      # They are not wired with `fromService: { property: host }` because that
      # resolves to the internal service name — `lingolive-web-staging` with no
      # domain. The API then refuses to boot ("must use https://") and, once it
      # does, every browser request is blocked by CORS because the real origin
      # ends in .onrender.com and the allow-list does not.
      #
      # So they are entered once, from what Render shows at the top of each
      # service's page. CORS_ALLOWED_ORIGINS is deliberately absent: it
      # defaults to APP_BASE_URL.
      - key: APP_BASE_URL
        sync: false # https://lingolive-web-staging-xxxx.onrender.com
      - key: WEB_BASE_URL
        sync: false # the same value as APP_BASE_URL
      - key: API_BASE_URL
        sync: false # https://lingolive-api-staging-xxxx.onrender.com
      - key: DEEP_LINK_SCHEME
        value: lingolive
      # --- Secrets: fill in the dashboard, never here -----------------------
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: TRANSCRIPT_ENCRYPTION_KEY
        # Render generates it; the API derives the AES-256 key from it. Nobody
        # has to produce base64-encoded random bytes by hand. Once a deploy has
        # written a transcript, changing this value orphans it.
        generateValue: true
      - key: TRANSCRIPT_ENCRYPTION_KEY_VERSION
        value: '1'
      - key: OPENAI_API_KEY
        sync: false # Server-side only. Never in a web or mobile variable.
      - key: ADMIN_EMAILS
        sync: false
      # --- AI ---------------------------------------------------------------
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-live-transcribe
      - key: OPENAI_TRANSLATION_MODEL
        # A TEXT/chat model: translation is a /chat/completions call, never a
        # realtime or speech-to-speech model.
        #
        # `luna` is the fast, low-cost tier of the 5.6 family, which is the
        # right trade here — this call sits between a sentence being spoken and
        # someone reading it, on short text, at high volume. A larger reasoning
        # model buys accuracy nobody perceives and latency everybody does.
        #
        # Verified against the OpenAI model list on 2026-07-31. Re-check at
        # deploy time: `pnpm check:provider --all` asks your own account and
        # proves the answer. The code deliberately has no default, so this
        # value is visible and changeable here rather than buried.
        value: gpt-5.6-luna
      - key: REALTIME_TOKEN_TTL_SECONDS
        value: '60'
      # If starting a session returns 404 from the provider, the other realtime
      # entry point is /transcription_sessions. Changeable here, no deploy.
      - key: OPENAI_REALTIME_SESSION_PATH
        value: /client_secrets
      # --- Quotas & cost ----------------------------------------------------
      - key: GUEST_MINUTES_PER_MONTH
        value: '30'
      - key: FREE_MINUTES_PER_MONTH
        value: '120'
      - key: PRO_MINUTES_PER_MONTH
        value: '6000'
      - key: DAILY_COST_LIMIT_USD
        value: '25'
      - key: MONTHLY_COST_LIMIT_USD
        value: '200'
      - key: COST_CIRCUIT_BREAKER_ENABLED
        value: 'true'
      # --- Observability (optional) ----------------------------------------
      - key: SENTRY_DSN
        value: '' # Optional; empty means the integration is off.
      - key: SENTRY_ENVIRONMENT
        value: staging
      - key: POSTHOG_KEY
        value: '' # Optional; empty means the integration is off.
      - key: ANALYTICS_ENABLED
        value: 'false'
      # --- Switches ---------------------------------------------------------
      # The configuration schema refuses this outside development, and the
      # routes are not even mounted there. Staging is production-shaped.
      - key: ENABLE_DEV_SIMULATOR
        value: 'false'
      - key: ENABLE_REQUEST_LOGGING
        value: 'true'

  # ---------------------------------------------------------------------------
  # Web — staging
  # ---------------------------------------------------------------------------
  - type: web
    name: lingolive-web-staging
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: true
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm --filter @lingolive/web build
    startCommand: pnpm --filter @lingolive/web start
    healthCheckPath: /en
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      # Public by definition — these ship to the browser. No secret belongs here.
      - key: NEXT_PUBLIC_APP_ENV
        value: staging
      # Same reason as on the API: `property: host` gives an internal name, and
      # `new URL()` on it throws during the build. Entered once, from the URL
      # Render shows on each service.
      - key: NEXT_PUBLIC_API_URL
        sync: false # https://lingolive-api-staging-xxxx.onrender.com
      - key: NEXT_PUBLIC_WEB_URL
        sync: false # https://lingolive-web-staging-xxxx.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # the same value as NEXT_PUBLIC_WEB_URL
      - key: NEXT_PUBLIC_SENTRY_DSN
        value: '' # Optional; empty means the integration is off.
      - key: NEXT_PUBLIC_POSTHOG_KEY
        value: '' # Optional; empty means the integration is off.
      # Staging must never be indexed.
      - key: NEXT_PUBLIC_ALLOW_INDEXING
        value: 'false'

  # ---------------------------------------------------------------------------
  # Worker — retention, expiry, deletion requests, cost roll-up
  # ---------------------------------------------------------------------------
  - type: worker
    name: lingolive-worker-staging
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: .
    autoDeploy: true
    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm run build:packages
      pnpm exec prisma generate --schema prisma/schema.prisma
      pnpm --filter @lingolive/api build
      pnpm --filter @lingolive/worker build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: PNPM_VERSION
        value: 10.33.0
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase: { name: lingolive-db-staging, property: connectionString }
      - key: REDIS_URL
        fromService:
          {
            name: lingolive-redis-staging,
            type: keyvalue,
            property: connectionString,
          }
      # Pulled from the API, never entered twice. Two services holding
      # different encryption keys is a bug that only surfaces the first time
      # the worker touches encrypted data.
      - key: TRANSCRIPT_ENCRYPTION_KEY
        fromService:
          {
            name: lingolive-api-staging,
            type: web,
            envVarKey: TRANSCRIPT_ENCRYPTION_KEY,
          }
      - key: TRANSCRIPT_ENCRYPTION_KEY_VERSION
        value: '1'
      - key: SESSION_SIGNING_SECRET
        fromService:
          {
            name: lingolive-api-staging,
            type: web,
            envVarKey: SESSION_SIGNING_SECRET,
          }
      - key: AUTH_SECRET
        fromService:
          { name: lingolive-api-staging, type: web, envVarKey: AUTH_SECRET }
      # Retention, expiry and deletion only. It never calls an AI provider,
      # never serves a request and never emits a URL, so OPENAI_API_KEY,
      # ADMIN_API_TOKEN and the base URLs are all deliberately absent — the
      # smallest set of credentials that lets it do its job.
      - key: SERVICE_ROLE
        value: worker
      - key: RETENTION_UNSAVED_SESSION_HOURS
        value: '1'
      - key: RETENTION_BUSINESS_SESSION_DAYS
        value: '7'
      - key: RETENTION_TECHNICAL_LOG_DAYS
        value: '30'
      - key: WORKER_INTERVAL_MS
        value: '300000'
