name: Accessibility issue
description: Something is unusable or hard to use with assistive technology
labels: [accessibility, bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        LingoLive targets WCAG 2.2 AA. An accessibility issue is a bug, not a
        nice-to-have, and is triaged as one.

  - type: textarea
    id: barrier
    attributes:
      label: What is not usable
      placeholder: |
        With VoiceOver on, the speak button in tile 3 announces "button" with no label.
    validations:
      required: true

  - type: dropdown
    id: technology
    attributes:
      label: Assistive technology
      multiple: true
      options:
        - VoiceOver (iOS/macOS)
        - TalkBack (Android)
        - Screen reader on the web (NVDA, JAWS, Orca…)
        - Keyboard only
        - Switch control
        - Dynamic Type / large text
        - Reduced motion
        - High contrast / increased contrast
        - Zoom or magnification
    validations:
      required: true

  - type: dropdown
    id: criterion
    attributes:
      label: Related WCAG criterion, if you know it
      options:
        - '1.3.1 Info and relationships'
        - '1.4.3 Contrast (minimum)'
        - '1.4.4 Resize text'
        - '1.4.10 Reflow'
        - '2.1.1 Keyboard'
        - '2.4.7 Focus visible'
        - '2.5.8 Target size (minimum)'
        - '3.3.2 Labels or instructions'
        - '4.1.2 Name, role, value'
        - '4.1.3 Status messages'
        - "I'm not sure"

  - type: input
    id: where
    attributes:
      label: Screen
      placeholder: Discuss, 4 tiles, second tile rotated 90°

  - type: input
    id: environment
    attributes:
      label: Platform, version and language
      placeholder: iOS 18.2, LingoLive 1.0.0, interface in Arabic
